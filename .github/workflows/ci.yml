name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pyright
      - run: pytest --cov=app --cov-report=term --cov-report=xml

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 pytest -m browser tests/test_browser_smoke.py

  # Reports how on-device Vision OCR behaves on GitHub's macOS; it does not gate
  # the build. These tests assert near-exact OCR output, and Apple changes the
  # Vision engine between macOS releases -- including point releases. macOS 26
  # reads "bread" as "bread cone loaf"; macOS 15.7.7 reads "litres" as "lites"
  # and the brand "havmor" as "harma", while all 165 pass on a 15.6.1 dev
  # machine with identical Python and Pillow. GitHub only publishes major-version
  # labels and tracks their latest point release, so the engine cannot be pinned
  # and any exact-output gate here would drift red on GitHub's next image bump.
  # The suite stays strict locally, where the Vision version is known. See the
  # held-out evaluator in tools/ for actual accuracy measurement.
  macos-vision:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          pytest
          tests/test_local_vision.py
          tests/test_degraded_photo_scenarios.py
          tests/test_grocery_photo_regressions.py
          tests/test_ocr_fixture_repairs.py
