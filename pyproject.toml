[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: end-to-end tests that require an installed Chromium browser",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/ocr_fixture_repairs.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["app", "tools"]
exclude = [".venv", "browser_profile", "browser_profile_zepto"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
